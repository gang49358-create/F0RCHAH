<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messenger</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ЭКРАН ВХОДА -->

<div id="auth">


<h1>Messenger</h1>


<input id="username" placeholder="Имя пользователя">


<input id="email" type="email" placeholder="Email">


<input id="password" type="password" placeholder="Пароль">



<button id="register">
Создать аккаунт
</button>


<button id="login">
Войти
</button>



<p id="error"></p>


</div>








<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->


<div id="main" style="display:none;">



<!-- ПАНЕЛЬ КОНТАКТОВ -->


<aside id="sidebar">


<div id="myProfile">


<img id="miniAvatar"
src=""
alt="avatar">


<div>

<b id="myName">
User
</b>


<p id="myBio">
Описание
</p>


</div>



<button id="settings">
⚙️
</button>


</div>





<h3>
Контакты
</h3>



<div id="usersList">

</div>



</aside>







<!-- ОКНО ЧАТА -->


<section id="chat">


<header id="chatHeader">

Выберите контакт

</header>





<div id="messages">

</div>






<div id="sendBox">


<input 
id="messageInput"
placeholder="Написать сообщение...">



<button id="send">
➤
</button>



</div>



</section>



</div>









<!-- ОКНО ПРОФИЛЯ -->


<div id="profileWindow" style="display:none;">



<h2>
Мой профиль
</h2>





<img 
id="avatar"
src=""
alt="avatar">






<input 
id="avatarFile"
type="file"
accept="image/*,video/*">






<input
id="newUsername"
placeholder="Имя">





<textarea
id="bio"
placeholder="О себе">
</textarea>







<button id="saveProfile">
Сохранить
</button>





<p id="profileEmail"></p>





<button id="closeProfile">
Назад
</button>



<button id="logout">
Выйти
</button>



</div>







<script type="module" src="app.js"></script>


</body>

</html>
