<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messenger</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Вход -->

<div id="auth">


<h1>Messenger</h1>


<input 
id="username"
placeholder="Username">


<input 
id="email"
type="email"
placeholder="Email">


<input 
id="password"
type="password"
placeholder="Пароль">



<button id="register">
Регистрация
</button>


<button id="login">
Войти
</button>


<p id="error"></p>


</div>






<!-- Главное приложение -->


<div id="main" style="display:none;">



<!-- Левая панель -->


<div id="sidebar">


<div class="profile">


<img id="miniAvatar"
src=""
width="40"
height="40"
style="border-radius:50%;object-fit:cover;">


<span id="myName">
User
</span>


<button id="settings">
⚙️
</button>


</div>





<h3>
Контакты
</h3>


<div id="usersList">

</div>



</div>







<!-- Чат -->


<div id="chat">


<div id="chatHeader">

Выберите пользователя

</div>



<div id="messages">

</div>




<div id="sendBox">


<input 
id="messageInput"
placeholder="Сообщение...">



<button id="send">
➤
</button>



</div>



</div>


</div>








<!-- Профиль -->


<div id="profileWindow" style="display:none;">


<h2>
Мой профиль
</h2>



<img 
id="avatar"
src=""
width="120"
height="120"
style="
border-radius:50%;
object-fit:cover;
">



<input 
type="file"
id="avatarFile"
accept="image/*,video/*">





<input 
id="newUsername"
placeholder="Имя пользователя">





<textarea
id="bio"
placeholder="Описание о себе">
</textarea>





<button id="saveProfile">
Сохранить
</button>



<p id="profileEmail"></p>



<button id="logout">
Выйти
</button>



<button id="closeProfile">
Назад
</button>



</div>







<script type="module" src="app.js"></script>


</body>

</html>
