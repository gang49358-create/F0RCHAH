<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messenger</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- Авторизация -->

<div id="authPage">


<h1>Messenger</h1>


<input id="username" placeholder="Username">


<input id="email" type="email" placeholder="Email">


<input id="password" type="password" placeholder="Пароль">


<button id="registerBtn">
Регистрация
</button>


<button id="loginBtn">
Войти
</button>


<p id="authError"></p>


</div>








<!-- Основное приложение -->


<div id="appPage" style="display:none;">



<!-- Левая часть -->


<div id="leftPanel">


<div id="profileMini">


<img id="miniAvatar" src="">


<div>

<b id="profileName">
User
</b>


<span id="profileBio">
Описание
</span>


</div>


<button id="openProfile">
⚙️
</button>


</div>





<h3>
Контакты
</h3>



<div id="users">

</div>



</div>








<!-- Чат -->


<div id="chatPanel">


<div id="chatTop">

Выберите пользователя

</div>



<div id="messages">

</div>




<div id="messageBox">


<input 
id="messageText"
placeholder="Сообщение...">



<button id="sendBtn">
➤
</button>



</div>



</div>



</div>









<!-- Окно профиля -->


<div id="profilePage" style="display:none;">



<h2>
Мой профиль
</h2>




<img id="bigAvatar" src="">





<input 
id="avatarInput"
type="file"
accept="image/*,video/*">





<input 
id="editName"
placeholder="Имя">





<textarea 
id="editBio"
placeholder="Описание о себе">
</textarea>





<button id="saveProfileBtn">
Сохранить
</button>





<button id="backBtn">
Назад
</button>





<button id="logoutBtn">
Выйти
</button>



</div>







<script type="module" src="app.js"></script>


</body>

</html>
