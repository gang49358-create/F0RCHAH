<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messenger</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<!-- Регистрация и вход -->

<div id="auth">


<h1>Messenger</h1>


<input 
id="username"
type="text"
placeholder="Username">


<input 
id="email"
type="email"
placeholder="Email">


<input 
id="password"
type="password"
placeholder="Пароль">



<button id="register">
Регистрация
</button>



<button id="login">
Войти
</button>



<p id="error"></p>


</div>





<!-- Чат -->


<div id="chat" style="display:none;">



<div class="header">


<h2 id="myName">
Профиль
</h2>


<button id="settings">
⚙️
</button>


</div>





<div id="contacts">


<h3>
Контакты
</h3>


<div id="usersList">

</div>


</div>






<div id="chatTitle">

Выберите пользователя

</div>





<div id="messages">

</div>






<div class="send">


<input
id="messageInput"
placeholder="Сообщение...">



<button id="send">
➤
</button>


</div>




</div>


</div>




<script type="module" src="app.js"></script>


</body>

</html>
