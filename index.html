<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Messenger</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div id="auth">

        <h1>Messenger</h1>

        <input 
        id="email" 
        type="email" 
        placeholder="Почта">

        <input 
        id="password" 
        type="password" 
        placeholder="Пароль">


        <button id="register">
            Регистрация
        </button>


        <button id="login">
            Войти
        </button>


        <p id="error"></p>

    </div>



    <div id="chat" style="display:none;">

        <div class="header">
            <h2>Чат</h2>

            <button id="logout">
                Выйти
            </button>
        </div>


        <div id="messages">

        </div>


        <div class="send">

            <input 
            id="messageInput"
            placeholder="Сообщение...">


            <button id="send">
                ➤
            </button>

        </div>


    </div>


</div>


<script type="module" src="app.js"></script>

</body>
</html>
