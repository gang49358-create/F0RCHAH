<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messenger</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="auth">

<h1>Messenger</h1>


<input id="username" placeholder="Username">


<input id="email" type="email" placeholder="Email">


<input id="password" type="password" placeholder="Пароль">



<button id="register">
Регистрация
</button>


<button id="login">
Войти
</button>


<p id="error"></p>


</div>





<div id="main" style="display:none;">



<div id="sidebar">


<div class="profile">

<span id="myName">
User
</span>


<button id="settings">
⚙️
</button>

</div>



<h3>Контакты</h3>


<div id="usersList">

</div>


</div>






<div id="chat">


<div id="chatHeader">

Выберите пользователя

</div>



<div id="messages">

</div>




<div id="sendBox">


<input id="messageInput"
placeholder="Сообщение...">


<button id="send">
➤
</button>


</div>


</div>


</div>







<div id="profileWindow" style="display:none;">


<h2>Настройки</h2>


<input id="newUsername"
placeholder="Новое имя">


<button id="saveProfile">
Сохранить
</button>


<p id="profileEmail"></p>


<button id="logout">
Выйти
</button>


<button id="closeProfile">
Назад
</button>


</div>





<script type="module" src="app.js"></script>


</body>

</html>
